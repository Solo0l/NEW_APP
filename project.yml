name: PACE
options:
  bundleIdPrefix: com.pace
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages: {}

targets:

  # ─────────────────────────────────────────────
  # iOS App
  # ─────────────────────────────────────────────
  PACE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PACE
        excludes:
          - "**/.DS_Store"
    info:
      path: PACE/Resources/Info.plist
      properties:
        CFBundleName: PACE
        CFBundleDisplayName: PACE
        CFBundleIdentifier: com.pace.app
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "PACE tracks your GPS route while you run."
        NSLocationAlwaysAndWhenInUseUsageDescription: "PACE continues tracking your route when running with the screen off."
        NSMotionUsageDescription: "PACE uses motion data to detect auto-pause."
        NSHealthShareUsageDescription: "PACE reads heart rate and workout data to improve your run summary."
        NSHealthUpdateUsageDescription: "PACE saves your workouts to Apple Health."
        UIBackgroundModes:
          - location
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pace.app
        INFOPLIST_FILE: PACE/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - target: PACEWatch
        embed: true

  # ─────────────────────────────────────────────
  # watchOS App
  # ─────────────────────────────────────────────
  PACEWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PACEWatch
        excludes:
          - "**/.DS_Store"
      # Share model files with iOS target
      - path: PACE/Models
      - path: PACE/Utilities/Formatters.swift
      - path: PACE/DesignSystem/PACEFonts.swift
    info:
      path: PACEWatch/Resources/Info.plist
      properties:
        CFBundleName: PACE
        CFBundleDisplayName: PACE
        CFBundleIdentifier: com.pace.watch
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        NSHealthShareUsageDescription: "PACE reads heart rate during your run."
        NSHealthUpdateUsageDescription: "PACE saves your run to Apple Health."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pace.watch
        INFOPLIST_FILE: PACEWatch/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
