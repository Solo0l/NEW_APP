name: PACE
options:
  bundleIdPrefix: com.pace
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:

  # ─────────────────────────────
  # iOS App
  # ─────────────────────────────
  PACE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PACE
        excludes: ["**/.DS_Store", "**/OnboardingFlow.swift", "**/QuickSetupView.swift"]
    info:
      path: PACE/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pace.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - target: PACEWatch
        embed: true

  # ─────────────────────────────
  # watchOS App
  # ─────────────────────────────
  PACEWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # Watch-specific source
      - path: PACEWatch
        excludes: ["**/.DS_Store"]
      # Shared model types (includes Enums.swift which defines RunPhase)
      - path: PACE/Models
      # Shared formatting utilities
      - path: PACE/Utilities/Formatters.swift
      # Shared design tokens used by Watch views
      - path: PACE/DesignSystem/PACEFonts.swift
      - path: PACE/DesignSystem/PACEColors.swift
      - path: PACE/DesignSystem/PACESpacing.swift
      # Shared extensions
      - path: PACE/Utilities/Extensions.swift
    info:
      path: PACEWatch/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pace.watch
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
